[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-normalize"
version = "0.1.0"
description = "Recover canonical SNOMED/LOINC codes from messy free-text clinical data, with a measured recovery benchmark on synthetic FHIR."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "CiphemonJY" }]
keywords = ["fhir", "snomed", "loinc", "clinical-nlp", "terminology", "healthcare", "rag"]
dependencies = []

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2", "chromadb>=0.4"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/CiphemonJY/fhir-normalize"

[tool.setuptools.packages.find]
include = ["fhir_normalize*"]
